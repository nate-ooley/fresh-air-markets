name: Portal regression checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: fresh_air_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa -d fresh_air_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: fresh-air-markets
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fresh-air-markets/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run isolated regression tests
        run: npm test
      - name: Verify limiter, application capture and bookings in PostgreSQL
        env:
          DATABASE_TEST_URL: postgres://qa:isolated-ci-only@127.0.0.1:5432/fresh_air_test
        run: npm run test:pg
      - name: Build portal
        run: npm run build
