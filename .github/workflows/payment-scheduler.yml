name: Fresh Air payment recovery

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fresh-air-production-payment-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: ${{ vars.FAME_PAYMENT_SCHEDULER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FAME_PAYMENT_SCHEDULER_ENABLED: ${{ vars.FAME_PAYMENT_SCHEDULER_ENABLED }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      FAME_VENDOR_PORTAL_ORIGIN: ${{ vars.FAME_VENDOR_PORTAL_ORIGIN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Recover scoped payment workflows
        run: node fresh-air-markets/scripts/run-payment-scheduler.mjs
